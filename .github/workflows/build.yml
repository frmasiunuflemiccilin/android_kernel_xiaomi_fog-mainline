name: Build Obsidian Kernel (Fog - KSU + NetHunter)

on:
  workflow_dispatch:

jobs:
  build:
    name: Compile & Pack Kernel
    runs-on: ubuntu-22.04

    steps:
    - name: Mengunduh Source Code Kernel
      uses: actions/checkout@v4

    - name: Menyiapkan Lingkungan Build (Dependencies)
      run: |
        sudo apt-get update
        sudo apt-get install -y bc bison build-essential ccache curl flex g++-multilib gcc-multilib git gnupg gperf imagemagick lib32ncurses5-dev lib32readline-dev lib32z1-dev liblz4-tool libncurses5 libncurses5-dev libsdl1.2-dev libssl-dev libxml2 libxml2-utils lzop pngcrush rsync schedtool squashfs-tools xsltproc zip zlib1g-dev python3

    - name: Mengunduh Proton-Clang Toolchain
      run: |
        git clone --depth=1 https://github.com/kdrag0n/proton-clang.git clang

    - name: Mulai Kompilasi Kernel
      run: |
        export PATH="$GITHUB_WORKSPACE/clang/bin:$PATH"
        export ARCH=arm64
        export SUBARCH=arm64
        
        # Membersihkan sisa build
        make O=out clean
        make O=out mrproper

        # Memuat konfigurasi defconfig Fog
        make O=out ARCH=arm64 vendor/fog-perf_defconfig

        # Eksekusi kompilasi
        make -j$(nproc --all) O=out ARCH=arm64 CC=clang \
             CROSS_COMPILE=aarch64-linux-gnu- \
             CROSS_COMPILE_ARM32=arm-linux-gnueabi-

    - name: Membungkus dengan AnyKernel3 (Flashable Zip)
      run: |
        # Mengunduh AnyKernel3 resmi bawaan osm0sis
        git clone https://github.com/osm0sis/AnyKernel3.git AnyKernel3
        cd AnyKernel3
        
        # Hapus folder .git
        rm -rf .git
        
        # Pindahkan file kernel (Image/Image.gz-dtb)
        if [ -f ../out/arch/arm64/boot/Image.gz-dtb ]; then
          cp ../out/arch/arm64/boot/Image.gz-dtb .
        elif [ -f ../out/arch/arm64/boot/Image.gz ]; then
          cp ../out/arch/arm64/boot/Image.gz .
        elif [ -f ../out/arch/arm64/boot/Image ]; then
          cp ../out/arch/arm64/boot/Image .
        fi
        
        # Pindahkan dtb / dtbo jika ada
        if [ -f ../out/arch/arm64/boot/dtbo.img ]; then
          cp ../out/arch/arm64/boot/dtbo.img .
        fi
        if [ -f ../out/arch/arm64/boot/dtb.img ]; then
          cp ../out/arch/arm64/boot/dtb.img .
        fi

        # Membuat file zip akhir
        zip -r9 ../Obsidian-Kernel-Fog-NH-KSU.zip * -x .git README.md *placeholder

    - name: Mengunggah Hasil Akhir (Flashable Zip)
      uses: actions/upload-artifact@v4
      with:
        name: Obsidian-Kernel-Fog-Flashable-Zip
        path: Obsidian-Kernel-Fog-NH-KSU.zip
        
